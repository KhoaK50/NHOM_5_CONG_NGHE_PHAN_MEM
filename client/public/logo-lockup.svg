<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 44" fill="none" width="100%" height="100%">
  <defs>
    <!-- Left Loop: Sapphire Navy to Electric Blue -->
    <linearGradient id="lockup-loop-left" x1="8" y1="33" x2="24" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2a66"/>
      <stop offset="28%" stop-color="#004da6"/>
      <stop offset="70%" stop-color="#007fe6"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>

    <!-- Right Loop: Deep Indigo to Electric Cyan -->
    <linearGradient id="lockup-loop-right" x1="20" y1="11" x2="36" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07224f"/>
      <stop offset="28%" stop-color="#005dbf"/>
      <stop offset="70%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#00c7fe"/>
    </linearGradient>

    <!-- Top Fold Crease Shading -->
    <linearGradient id="lockup-crease-top" x1="24" y1="12" x2="20.5" y2="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020c1e" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#020c1e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020c1e" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Fold Crease Shading -->
    <linearGradient id="lockup-crease-bottom" x1="20" y1="32" x2="23.5" y2="28.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020c1e" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#020c1e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020c1e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- === ICON MARK (Interlocking Ribbon Loops) === -->
  <!-- 1. Right Loop Base: Center (28, 22), Radius 10.5, Stroke 4.8 -->
  <circle cx="28" cy="22" r="10.5" stroke="url(#lockup-loop-right)" stroke-width="4.8"/>

  <!-- 2. Top Fold Crease (Underpass contact shadow) -->
  <path d="M 24.2 15 A 10.5 10.5 0 0 0 19.8 12.2" stroke="url(#lockup-crease-top)" stroke-width="4.8" stroke-linecap="butt"/>

  <!-- 3. Left Loop Base: Center (16, 22), Radius 10.5, Stroke 4.8 -->
  <circle cx="16" cy="22" r="10.5" stroke="url(#lockup-loop-left)" stroke-width="4.8"/>

  <!-- 4. Bottom Fold Crease (Underpass contact shadow) -->
  <path d="M 19.8 29 A 10.5 10.5 0 0 0 24.2 31.8" stroke="url(#lockup-crease-bottom)" stroke-width="4.8" stroke-linecap="butt"/>

  <!-- 5. Top Crossing Overpass: Left Loop cleanly over Right Loop -->
  <path d="M 16 11.5 A 10.5 10.5 0 0 1 25.1 16.7" stroke="url(#lockup-loop-left)" stroke-width="4.8" stroke-linecap="butt"/>

  <!-- 6. Bottom Crossing Overpass: Right Loop cleanly over Left Loop -->
  <path d="M 28 32.5 A 10.5 10.5 0 0 1 18.9 27.3" stroke="url(#lockup-loop-right)" stroke-width="4.8" stroke-linecap="butt"/>

  <!-- === WORDMARK TYPOGRAPHY ('5share' in Be Vietnam Pro, slate-12 #11181c) === -->
  <text x="48" y="29.5" font-family="'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.025em" fill="#11181c">5share</text>
</svg>
